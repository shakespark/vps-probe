# vps-probe-echo 的配置，安装为 /etc/vps-probe/echo.yml。
# 里面有 key：root:vps-probe-echo，权限 0640（install.sh 会设好）。
#
# 它只装在隧道的终点：某个 agent 里 `type: echo` 的 peer 用这个 key 签名发来请求
# （通常经过端口转发），它原样回一个包，agent 据此算出经隧道的时延。
# 签名不对的包一律不回应。

listen: ":39527"            # UDP，IPv4 和 IPv6 都监听

# 可选：同一个端口也接受 TCP，给 `type: echo-tcp` 的 peer 用（隧道不通 UDP，或者转发
# 面板要靠 TCP 连接判断规则是否正常）。打开以后端口能被扫描到：TCP 握手由内核完成，
# 但连接上除了对正确签名请求的回应，不会写出任何数据。
# tcp: true

# 和探测它的 agent peer 共用。用 `vps-probe-server gen-token` 生成。
key: "<key>"

# 可选：只回应这些来源 IP / 网段，比如它前面那些中转机的出口 IP。
# 不写 = 签名正确的来源都回应。
# allow: [203.0.113.7, 198.51.100.0/24]

# 可选：每秒最多回应多少个包，默认 1000。
# max_pps: 1000
