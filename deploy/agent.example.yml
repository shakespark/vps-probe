# vps-probe-agent 的配置，安装为 /etc/vps-probe/agent.yml。
# 里面有本节点的 token：root:vps-probe-agent，权限 0640（install.sh 会设好）。
#
# 一般不用手写：服务端的 `vps-probe-server add-node` / `install-cmd` 会按 server.yml
# 生成它并装好。agent 只读这个本地文件，不接受服务端下发的任何配置。

node: hk-1                    # 节点 id，和 server.yml 里的一致
server: 203.0.113.1:9527      # 服务端的 UDP 地址，可以写域名
token: "<这个节点的 token>"   # 和 server.yml 里这个节点的 token 一致

# 报告这些挂载点的磁盘用量。默认只有根分区。
# disks: ["/", "/data"]

# 流量统计算哪些网卡。默认自动识别：物理网卡；有多块时只算带默认路由的
# （第二块通常是内网）；容器里没有物理网卡，算默认路由所在的那块。
# 识别得不对时在这里写明。
# interfaces: [eth0]

# 计费周期从每月几号、几点开始。周期的起止由 agent 自己算好再上报。
traffic:
  timezone: Asia/Shanghai     # 和服务端的 timezone 保持一致
  reset_day: 1                # 默认 1（自然月）；当月没有这一天时用月末
  reset_time: "00:00"         # 默认 00:00

# 时延互测的目标。name 写对方在 server.yml 里的节点 id，时延矩阵才能对上。
peers:
  - { name: jp-1, addr: 203.0.113.5 }
  - { name: us-1, addr: us1.example.com }
  # 只转发 TCP/UDP 的隧道（端口转发）没法 ping，用下面两种，addr 写 host:port：
  # type: dns  向它发一个 DNS 查询。把本地端口转发到 1.1.1.1:53 就能测这条隧道。
  # - { name: cf-relay, addr: "127.0.0.1:15353", type: dns }
  # type: echo 向隧道另一端的 vps-probe-echo 发带签名的请求；key 是那边 echo.yml 里的 key。
  # - { name: hk2-via-sgp, addr: "127.0.0.1:39527", type: echo, key: "<那边的 key>" }
